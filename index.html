<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Carnet de lecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: library of book cards → book view with a chapter rail (table of contents) on the left and the reading desk on the right. */
:root{
  --bg:#eceee9; --surface:#fafbf8; --surface-2:#f2f4ef; --ink:#1c2330; --muted:#5b6470; --line:#d3d8cf;
  --accent:#2d3c9c; --accent-soft:#e2e5f6; --accent-ink:#ffffff;
  --hl:rgba(246,214,64,.55); --ok:#2b7a4b; --warn:#9a6200; --bad:#b3261e;
  --p1:#2d5fbf; --p2:#1f8a5b; --p3:#8a3fb5; --p4:#c0661b; --keep-bg:#fff6cf; --keep-line:#e3b400; --ctx-bg:#eef1fb;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13161b; --surface:#1b1f26; --surface-2:#222731; --ink:#e5e8ed; --muted:#99a2ad; --line:#2e343e;
  --accent:#9aa6ff; --accent-soft:#262c4d; --accent-ink:#10131c;
  --hl:rgba(212,176,20,.38); --ok:#6cc28f; --warn:#e0a640; --bad:#f08178;
  --p1:#7ea6ff; --p2:#5fd1a0; --p3:#c99af0; --p4:#f0a868; --keep-bg:#3a3214; --keep-line:#d4b014; --ctx-bg:#222947; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --surface-2:#222731; --ink:#e5e8ed; --muted:#99a2ad; --line:#2e343e;
  --accent:#9aa6ff; --accent-soft:#262c4d; --accent-ink:#10131c;
  --hl:rgba(212,176,20,.38); --ok:#6cc28f; --warn:#e0a640; --bad:#f08178;
  --p1:#7ea6ff; --p2:#5fd1a0; --p3:#c99af0; --p4:#f0a868; --keep-bg:#3a3214; --keep-line:#d4b014; --ctx-bg:#222947; color-scheme:dark }

*{box-sizing:border-box}
/* fiche de synthèse */
.ai{display:flex;flex-direction:column;gap:12px;min-width:0}
.ai-empty{padding:16px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2)}
.fiche{display:flex;flex-direction:column;gap:14px;font-family:var(--f-read);line-height:1.6;max-width:72ch;min-width:0}
.fiche:empty{display:none}
.fiche .f{display:flex;flex-direction:column;gap:8px;min-width:0}
.fiche .f-h{font-family:var(--f-ui);font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.fiche .f-ctx{background:var(--ctx-bg);border-radius:var(--r);padding:12px 16px;font-size:1.05rem}
.fiche .f-ctx .f-h{color:var(--accent)}
.fiche .f-part{display:flex;align-items:center;gap:10px;margin:6px 0 0;font-family:var(--f-read);font-size:1.05rem;font-weight:600;color:var(--pc)}
.fiche .f-num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pc);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:.8rem;font-weight:600}
.fiche ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.fiche li::marker{color:var(--muted)}
.fiche p{margin:0}
.fiche mark.k{background:linear-gradient(transparent 50%, var(--hl) 50%);color:inherit;font-weight:600;padding:0 2px}
.fiche .f-facts ul{list-style:none;padding:0}
.fiche .f-facts li{padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.fiche .f-facts mark.k{background:none;color:var(--accent);font-family:var(--f-mono);font-size:.92em}
.fiche .f-keep{background:var(--keep-bg);border:1px solid var(--keep-line);border-radius:var(--r);padding:12px 16px}
.fiche .f-keep .f-h{color:var(--ink)}
.fiche .f-keep .f-h::before{content:"★ ";color:var(--keep-line)}
.fiche .chip{vertical-align:2px}
.warn-t{color:var(--warn)}
details.reperes>summary{padding:8px 0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 60px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-read);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible,.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:140px;font-family:var(--f-read);line-height:1.6}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.85rem;cursor:pointer;background:var(--surface)}
.langs label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* top bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .label{color:var(--accent)}
.banner{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* library */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.book{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;min-height:150px}
.book:hover{border-color:var(--accent)}
.spine{width:14px;flex:none;background:var(--spine,#2d3c9c)}
.book .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.book h3{font-size:1.1rem}
.stats{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-top:auto}
.tag{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.empty{padding:28px;text-align:left;display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:var(--r)}

/* book view */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.rail{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px);display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
@media (max-width:820px){.rail{position:static}}
.toc-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;text-align:left;border:1px solid transparent;background:transparent;padding:8px;border-radius:7px;width:100%}
.toc-item:hover{background:var(--surface-2);border-color:transparent}
.toc-item.on{background:var(--accent-soft);color:var(--ink)}
.toc-num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.toc-title{font-family:var(--f-read);font-weight:600;overflow-wrap:anywhere}
.toc-pages{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.bookhead{display:flex;flex-direction:column;gap:6px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}

/* drop zone + queue */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.qitem{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;font-size:.75rem;min-width:0}
.qitem img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--surface-2)}
.qitem .st{padding:5px 7px;display:flex;justify-content:space-between;gap:4px;align-items:center}
.qitem .qerr{padding:0 7px 7px;color:var(--bad);font-size:.72rem;line-height:1.35;overflow-wrap:anywhere}
.st-working{color:var(--accent)} .st-done{color:var(--ok)} .st-error{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 12px;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* summary */
.summary{display:flex;flex-direction:column;gap:18px}
.overview{font-family:var(--f-read);font-size:1.05rem;line-height:1.7;max-width:68ch;display:flex;flex-direction:column;gap:10px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.sbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.sbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sbox li{display:flex;flex-direction:column;gap:3px;padding-bottom:8px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.sbox li:last-child{border-bottom:none}
.hl{background:linear-gradient(transparent 55%, var(--hl) 55%);padding:0 2px}
.date{font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);padding:1px 7px;border-radius:99px;cursor:pointer}
.chip:hover{color:var(--accent);border-color:var(--accent)}
.ref{font-family:var(--f-read);font-size:.92rem}
.themes{display:flex;flex-wrap:wrap;gap:6px}

/* pages */
.pages{display:flex;flex-direction:column;gap:12px}
.pagecard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:20px;transition:box-shadow .3s;min-width:0}
.pagecard.flash{box-shadow:0 0 0 3px var(--accent)}
.pno{font-family:var(--f-mono);font-weight:500;font-size:.85rem;color:var(--accent)}
.pagecard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.transcript{font-family:var(--f-read);line-height:1.7;white-space:pre-wrap;max-width:68ch;margin-top:8px;font-size:.95rem;overflow-wrap:anywhere}
.answer{display:flex;flex-direction:column;gap:10px}
.answer blockquote{margin:0;font-family:var(--f-read);line-height:1.65;padding:10px 14px;background:var(--surface-2);border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.err{color:var(--bad);font-size:.88rem}
.update{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.update[hidden]{display:none}
.update button.primary{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.update button.ghost{color:var(--accent-ink);opacity:.85}
.version{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding-top:24px;color:var(--muted);font-size:.82rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"><p class="muted">Chargement du carnet…</p></div>
<div class="toast" id="toast" hidden></div>
<div class="update" id="update" role="status" hidden><span id="update-txt">Une nouvelle version est disponible.</span><button class="primary" id="update-btn" type="button">Mettre à jour</button><button class="ghost" id="update-later" type="button" aria-label="Plus tard">Plus tard</button></div>

  const CUE = /\b(soudain|tout à coup|brusquement|finalement|meurt|mourut|mort|tué|naissance|naît|mariage|épouse|bataille|guerre|victoire|défaite|découvr|révèl|décid|fuit|rencontr|trahi|crise|révolution|fond[eéa]|invent|traité|accident|procès|exil|couronn|assassin|suddenly|finally|died|death|killed|born|married|battle|war|victory|defeat|discover|reveal|decid|fled|met |betray|crisis|revolution|founded|invented|treaty|trial|crown|murder|de repente|murió|muerte|nació|batalla|guerra|victoria|derrota|descubr|fundó|tratado|improvvisamente|morì|morte|nacque|battaglia|vittoria|sconfitta|scopr|fondò|trattato|plötzlich|starb|tod|geboren|schlacht|krieg|sieg|niederlage|entdeck|gründete|vertrag|mortuus|natus|bellum|proelium|victoria|vicit|interfectus|condidit|πόλεμ|μάχη|μάχ|νίκη|ἐνίκ|απέθαν|ἀπέθαν|θάνατ|γεννήθηκε|ίδρυσε|συνθήκη)/i;
  const KEYCUE = /\b(important|essentiel|principal|fondamental|surtout|en effet|donc|ainsi|en conclusion|en somme|cause|conséquence|grâce|permet|key|main|essential|therefore|thus|because|result|crucial|importante|principal|por tanto|así|fondamentale|quindi|perciò|wichtig|wesentlich|daher|deshalb|also|igitur|ergo|itaque|enim|γάρ|οὖν|άρα|επομένως)\b/i;
  const TITLE = /^(m\.|mme|mlle|dr|st|ste|saint|sainte|roi|reine|empereur|général|docteur|professeur|monsieur|madame|maître|pape|mr\.?|mrs\.?|ms\.?|sir|lord|lady|king|queen|emperor|pope|don|doña|señor|señora|san|santa|re|papa|herr|frau|kaiser|könig|rex|imperator)$/i;

  function detectLang(text) {
    const ws = (text.match(/[\p{L}]+/gu) || []).slice(0, 1500).map(norm);
    if (!ws.length) return "fra";
    if (ws.filter(w => /[α-ω]/.test(w)).length > ws.length * 0.4) return /[ἀ-ῼ]/.test(text) ? "grc" : "ell";
    const L = ["fra", "eng", "spa", "ita", "deu", "lat"];
    let best = "fra", bs = -1;
    for (const k of L) { const s = STOP[k]; let c = 0; for (const w of ws) if (s.has(w)) c += 1 / L.filter(o => STOP[o].has(w)).length; if (c > bs) { bs = c; best = k; } }
    return best;
  }
  const stem = w => { w = norm(w); if (w.length > 6) return w.slice(0, Math.max(5, w.length - 3)); if (w.length > 4) return w.replace(/(es|s|e|x|n|um|us|a|o|i)$/, ""); return w; };
  const words = s => (s.match(/[\p{L}][\p{L}'’\-]*/gu) || []).map(w => w.replace(/^[\p{L}]{1,2}['’]/u, ""));
  const terms = (s, stop) => words(s).filter(w => w.length > 2 && !stop.has(norm(w)) && !ALLSTOP.has(norm(w))).map(stem);

  // Sépare le texte brut d'une page : numéro de page, titre de chapitre, références, corps.
  function parsePage(raw) {
    const lines = String(raw || "").replace(/\r/g, "").split("\n").map(l => l.replace(/\s+$/, ""));
    const keep = lines.map(() => true);
    const nonEmpty = lines.map((l, i) => [l.trim(), i]).filter(x => x[0]);
    let page = null, heading = null;
    const edge = [...nonEmpty.slice(0, 2), ...nonEmpty.slice(-3)];
    for (const [l, i] of edge) {
      let m = l.match(/^[-–—•\s]*(\d{1,4})[-–—•\s]*$/) || l.match(/^(\d{1,4})\s{2,}\S.{0,60}$/) || l.match(/^\S.{0,60}\s{2,}(\d{1,4})$/) || l.match(/^([IVXLCivxlc]{1,6})$/);
      if (m && !page) { page = m[1]; keep[i] = false; }
    }
    for (const [l, i] of nonEmpty.slice(0, 5)) {
      if (heading || l.length > 90) continue;
      if (CHAP.test(l)) {
        heading = l.replace(/\s+/g, " ").trim(); keep[i] = false;
        const nx = nonEmpty.find(x => x[1] > i);
        if (nx && nx[0].length < 70 && !/[.;:!?]$/.test(nx[0]) && !REFLINE.test(nx[0]) && nx[1] - i <= 2 && /^\s*$/.test(heading.replace(CHAP, "").replace(/[\s.:—–-]/g, ""))) { heading += " — " + nx[0]; keep[nx[1]] = false; }
      }
    }
    const refs = [];
    lines.forEach((l, i) => {
      const t = l.trim(); if (!t || !keep[i]) return;
      const m = t.match(REFLINE);
      if (m && BIB.test(t)) { let cit = m[2].trim(); const nx = lines[i + 1]?.trim(); if (nx && !REFLINE.test(nx) && !/[.)]$/.test(cit) && nx.length < 120) { cit += " " + nx; keep[i + 1] = false; } refs.push({ marker: m[1].replace(/[()[\]]/g, ""), citation: cit }); keep[i] = false; return; }
      if (/^(sources?|fuentes?|fonti|quellen?|bibliograph\w*|cf\.|vgl\.|voir|see)\b/i.test(t) && BIB.test(t)) { refs.push({ marker: "", citation: t }); keep[i] = false; }
    });
    const bodyRaw = lines.filter((_, i) => keep[i]).join("\n");
    const flat = bodyRaw.replace(/(\p{L})[-¬]\s*\n\s*(\p{Ll})/gu, "$1$2").replace(/\s*\n\s*/g, " ").replace(/[¹²³⁴⁵⁶⁷⁸⁹⁰]+/g, "").replace(/\s{2,}/g, " ");
    const seen = new Set(refs.map(r => r.citation));
    const inl = /\(([\p{Lu}][\p{L}'’ .\-]{1,40}(?:et al\.)?,?\s+(?:1[5-9]|20)\d{2}[a-z]?(?:\s*[,:]\s*(?:p+\.|S\.)?\s*\d+(?:[-–]\d+)?)?)\)/gu;
    let m; while ((m = inl.exec(flat))) if (!seen.has(m[1])) { seen.add(m[1]); refs.push({ marker: "", citation: m[1] }); }
    (flat.match(/https?:\/\/\S+|www\.\S+/g) || []).forEach(u => { if (!seen.has(u)) { seen.add(u); refs.push({ marker: "", citation: u }); } });
    return { page, heading, refs, body: flat.trim() };
  }

  function sentences(flat) {
    const parts = flat.match(/[^.!?;…·]+(?:[.!?;…·]+["»”’)\]]*|$)\s*/g) || [];
    const out = [];
    for (let p of parts) {
      p = p.trim(); if (!p) continue;
      const prev = out[out.length - 1];
      if (prev && (/\b(M|Mme|Mlle|Dr|St|Ste|Mr|Mrs|Sr|Sra|Hr|p|pp|cf|vgl|ibid|vol|n°|etc|av|apr|J\.-C|ca|env|bzw|z\.B|[A-ZΑ-Ω]|\d+\s?[adnv]|\d+\s?(?:av|apr))\.$/.test(prev) || /(^|\s)\d{1,2}\.$/.test(prev) || /\d\s?[adnv]\.\s?$/i.test(prev) && /^[CXJcχ]\./.test(p) || /^[\p{Ll}\d]/u.test(p) && prev.length < 25)) { out[out.length - 1] = prev + " " + p; continue; }
      out.push(p);
    }
    return out.map(s => s.trim()).filter(s => s.length >= 20 && (s.match(/\p{L}/gu) || []).length > s.length * 0.55);
  }

  function datesIn(s) {
    const found = []; let work = s;
    const res = [
      new RegExp(`\\b(\\d{1,2}(?:er|º|°|\\.)?\\s+(?:de\\s+)?(?:${MONTHS})(?:\\s+(?:de\\s+)?\\d{1,4})?)\\b`, "giu"),
      new RegExp(`\\b((?:${MONTHS})\\s+\\d{1,2},?\\s+\\d{3,4})\\b`, "giu"),
      new RegExp(`\\b((?:${MONTHS})\\s+(?:de\\s+)?\\d{3,4})\\b`, "giu"),
      /\b(\d{1,2}[/.]\d{1,2}[/.](?:\d{4}|\d{2}))\b/g,
      new RegExp(`\\b(\\d{1,4}\\s?(?:${ERA}))(?=[\\s,.;:)]|$)`, "gu"),
      /\b((?:années|years|años|anni|jahre)\s+(?:1[0-9]|20)\d0)\b/giu,
      /\b((?:1[0-9]|20)\d0s)\b/g,
      /\b([IVXLC]{1,5}(?:e|ème|eme|ᵉ)\s+siècle|[IVXLC]{1,5}\.?\s+(?:siglo|secolo|Jahrhundert|century)|\d{1,2}(?:st|nd|rd|th)\s+century|\d{1,2}\.\s+Jahrhundert)\b/giu,
      /\b((?:1[0-9]|20)\d{2})\b(?!\s+[\p{Ll}])/gu,
      /\b(?:en|vers|dès|depuis|in|en el|nel|im|anno|um|circa|ca\.)\s+((?:1[0-9]|20)\d{2})\b/giu,
    ];
    for (const re of res) {
      re.lastIndex = 0; let m;
      while ((m = re.exec(work))) { const d = m[1].trim(); found.push(d); work = work.slice(0, m.index) + " ".repeat(m[0].length) + work.slice(m.index + m[0].length); re.lastIndex = m.index + m[0].length; }
    }
    return found;
  }
  function yearKey(d) {
    const neg = new RegExp(`(${"av|BC|BCE|a\\.?\\s?C|v\\.?\\s?Chr|π\\.?\\s?Χ"})`, "i").test(d);
    let m = d.match(/(\d{3,4})/); if (m) return neg ? -parseInt(m[1]) : parseInt(m[1]);
    m = d.match(/^([IVXLC]+)/i); if (m) { const r = { I: 1, V: 5, X: 10, L: 50, C: 100 }; let n = 0, prev = 0; for (const ch of m[1].toUpperCase().split("").reverse()) { const v = r[ch]; n += v < prev ? -v : v; prev = Math.max(prev, v); } return (n - 1) * 100 + 50; }
    m = d.match(/(\d{1,2})(?:st|nd|rd|th|\.)/); if (m && /century|jahrh/i.test(d)) return (parseInt(m[1]) - 1) * 100 + 50;
    m = d.match(/(\d{1,4})/); if (m) return neg ? -parseInt(m[1]) : parseInt(m[1]);
    return 99999;
  }

  function namesIn(flat) {
    const re = /((?:[\p{Lu}][\p{Ll}'’\-]+|[\p{Lu}]\.)(?:\s+(?:de\s+|d['’]|du\s+|des\s+|von\s+|van\s+|der\s+|del\s+|della\s+|da\s+|di\s+|of\s+|le\s+|la\s+)?(?:[\p{Lu}][\p{Ll}'’\-]+|[\p{Lu}]\.)){0,3})/gu;
    const out = []; let m;
    while ((m = re.exec(flat))) {
      const before = flat.slice(Math.max(0, m.index - 3), m.index);
      const start = m.index === 0 || /[.!?;:…»«"“·]\s*$|^\s*$/.test(before) && /[.!?;:…»«"“·]/.test(before + ".");
      let toks = m[1].split(/\s+/);
      while (toks.length && (ALLSTOP.has(norm(toks[0])) || CHAP.test(toks[0]))) toks.shift();
      let title = "";
      if (toks.length && TITLE.test(toks[0]) && toks.length > 1) { title = toks.shift(); }
      while (toks.length && ALLSTOP.has(norm(toks[toks.length - 1]))) toks.pop();
      if (!toks.length) continue;
      const name = toks.join(" ");
      if (name.length < 3 || new RegExp(`^(${MONTHS})$`, "i").test(name) || CHAP.test(name)) continue;
      out.push({ name: (title ? title + " " : "") + name, key: name, start: start && !title && toks.length === 1 });
    }
    return out;
  }

  // Analyse d'un ensemble de pages (une page, un chapitre ou le livre)
  function analyse(pages, opts = {}) {
    const text = pages.map(p => p.text).join("\n");
    const lang = opts.lang || detectLang(text);
    const stop = STOP[lang] || STOP.fra;
    const items = [], dates = new Map(), names = new Map(), refs = new Map(), moments = [];
    pages.forEach((p, pi) => {
      const pp = parsePage(p.text), pg = p.page ?? pp.page ?? "?";
      const ss = sentences(pp.body);
      ss.forEach((s, i) => items.push({ s, page: String(pg), pi, i, first: i === 0 && pi === 0 }));
      pp.refs.forEach(r => { const k = norm(r.citation); const o = refs.get(k) || { citation: r.citation, marker: r.marker, pages: [] }; if (!o.pages.includes(String(pg))) o.pages.push(String(pg)); refs.set(k, o); });
      ss.forEach(s => datesIn(s).forEach(d => { const ev = s.length > 220 ? s.slice(0, 217).trim() + "…" : s; const k = norm(d) + "|" + norm(ev).slice(0, 60); const o = dates.get(k) || { date: d, event: ev, pages: [], key: yearKey(d) }; if (!o.pages.includes(String(pg))) o.pages.push(String(pg)); dates.set(k, o); }));
      namesIn(pp.body).forEach(n => { const o = names.get(n.key) || { name: n.name, count: 0, startOnly: 0, pages: [] }; o.count++; if (n.start) o.startOnly++; if (n.name.length > o.name.length) o.name = n.name; if (!o.pages.includes(String(pg))) o.pages.push(String(pg)); names.set(n.key, o); });
    });
    // fusionne "Gutenberg" dans "Johannes Gutenberg"
    for (const [k, o] of names) if (!k.includes(" ")) { const full = [...names.entries()].find(([k2]) => k2 !== k && k2.split(" ").includes(k)); if (full) { full[1].count += o.count; o.pages.forEach(p => { if (!full[1].pages.includes(p)) full[1].pages.push(p); }); names.delete(k); } }
    const nameStems = new Set([...names.keys()].flatMap(k => k.split(" ").map(stem)));

    const tf = new Map();
    items.forEach(it => { it.t = terms(it.s, stop); new Set(it.t).forEach(t => tf.set(t, (tf.get(t) || 0) + 1)); });
    const N = Math.max(1, items.length);
    items.forEach(it => {
      const n = it.t.length; if (n < 4) { it.score = 0; return; }
      let sc = 0; for (const t of new Set(it.t)) sc += Math.log(1 + tf.get(t));
      sc /= Math.sqrt(n) + 2;
      if (datesIn(it.s).length) sc *= 1.25;
      if (KEYCUE.test(it.s)) sc *= 1.2;
      if (CUE.test(it.s)) sc *= 1.1;
      if (it.first) sc *= 1.2;
      if (n > 50) sc *= 0.7;
      if (/^[\p{Ll}]/u.test(it.s)) sc *= 0.7;
      it.score = sc;
    });
    const jacc = (a, b) => { const A = new Set(a.t), B = new Set(b.t); let i = 0; A.forEach(x => B.has(x) && i++); return i / Math.max(1, A.size + B.size - i); };
    const pick = (list, k) => { const out = []; for (const it of list) { if (out.length >= k) break; if (it.score <= 0) continue; if (out.some(o => jacc(o, it) > 0.5)) continue; out.push(it); } return out; };
    const ranked = [...items].sort((a, b) => b.score - a.score);

    const kOver = Math.max(Math.min(2, N), Math.min(opts.overview || 6, Math.round(N * (opts.ratio || 0.15))));
    const over = pick(ranked, kOver).sort((a, b) => a.pi - b.pi || a.i - b.i);
    const paras = []; for (let i = 0; i < over.length; i += 3) paras.push(over.slice(i, i + 3).map(x => x.s).join(" "));
    const key_points = pick(ranked, opts.points || 8).map(it => ({ point: it.s, pages: [it.page] }));
    const momentsL = pick(ranked.filter(it => CUE.test(it.s)), 5).sort((a, b) => a.pi - b.pi || a.i - b.i).map(it => ({ title: it.s, pages: [it.page] }));

    const people = [...names.values()].filter(o => o.name.includes(" ") || o.count - o.startOnly >= 1 && o.count >= 2 || /^\S+\s/.test(o.name) )
      .sort((a, b) => b.count - a.count).slice(0, 14).map(o => ({ name: o.name, role: o.count > 1 ? `cité ${o.count} fois` : "cité une fois", pages: o.pages }));
    const datesL = [...dates.values()].sort((a, b) => a.key - b.key).slice(0, 40);
    const themes = [...tf.entries()].filter(([t, f]) => f >= 2 && t.length >= 4 && !nameStems.has(t)).sort((a, b) => b[1] - a[1]).slice(0, 7)
      .map(([t]) => { const w = {}; items.forEach(it => words(it.s).forEach(x => { if (stem(x) === t) { const lx = x.toLowerCase(); w[lx] = (w[lx] || 0) + 1; } })); return Object.entries(w).sort((a, b) => b[1] - a[1])[0]?.[0] || t; });
    return { lang, overview: paras.join("\n\n"), key_points, dates: datesL, people, moments: momentsL, references: [...refs.values()], themes, items, stop };
  }

  // Recherche des passages qui répondent à une question
  function search(q, pages, lang) {
    const a = analyse(pages, { lang });
    const qt = [...new Set(terms(q, a.stop))]; if (!qt.length) return [];
    const df = new Map(); a.items.forEach(it => new Set(it.t).forEach(t => df.set(t, (df.get(t) || 0) + 1)));
    const N = a.items.length || 1;
    const qy = datesIn(q);
    return a.items.map(it => { const set = new Set(it.t); let sc = 0, hit = 0; qt.forEach(t => { if (set.has(t)) { sc += Math.log(1 + N / (df.get(t) || 1)); hit++; } else if ([...set].some(x => x.length > 4 && (x.startsWith(t) || t.startsWith(x)))) sc += 0.5; }); if (qy.length && qy.some(d => it.s.includes(d))) sc += 2; return { s: it.s, page: it.page, score: hit ? sc * (hit / qt.length + 0.5) : sc * 0.3 }; })
      .filter(x => x.score > 0.4).sort((a, b) => b.score - a.score).slice(0, 5);
  }
  return { analyse, parsePage, search, detectLang, datesIn, sentences };
})();
/* ===== FIN ANALYSE ===== */
</script>

/* ---------- storage: claude db (per viewer, private) with a browser fallback ---------- */
const Store = {
  mode: "local", db: null, uid: null,
  async init(db, user) {
    try { this.uid = user ? await user.id() : null; } catch { this.uid = null; }
    if (db && this.uid) { this.db = db; this.mode = "db"; }
  },
  base() { return "data/users/" + this.uid; },
  lsGet() { try { return JSON.parse(localStorage.getItem("carnet-lecture-v1") || "{}"); } catch { return {}; } },
  lsSet(o) { try { localStorage.setItem("carnet-lecture-v1", JSON.stringify(o)); } catch { toast("Impossible d'enregistrer dans ce navigateur."); } },
  async listBooks() {
    if (this.mode === "db") { const s = await this.db.collection(this.base()).get(); return s.docs.map(d => d.data()).filter(b => b && b.id); }
    return Object.values(this.lsGet().books || {});
  },
  async saveBook(b) {
    if (this.mode === "db") return this.db.collection(this.base()).doc(b.id).set(JSON.parse(JSON.stringify(b)));
    const o = this.lsGet(); o.books = o.books || {}; o.books[b.id] = b; this.lsSet(o);
  },
  async deleteBook(b, pages) {
    if (this.mode === "db") {
      for (const p of pages) await this.pageRef(b.id, p.id).delete();
      return this.db.collection(this.base()).doc(b.id).delete();
    }
    const o = this.lsGet(); delete (o.books || {})[b.id]; delete (o.pages || {})[b.id]; this.lsSet(o);
  },
  pageRef(bid, pid) { return this.db.doc(this.base() + "/" + bid).collection("pages").doc(pid); },
  async listPages(bid) {
    if (this.mode === "db") { const s = await this.db.doc(this.base() + "/" + bid).collection("pages").get(); return s.docs.map(d => d.data()); }
    return Object.values((this.lsGet().pages || {})[bid] || {});
  },
  async savePage(bid, p) {
    const clean = { id: p.id, chapterId: p.chapterId, page: p.page ?? null, text: p.text || "", source: p.source, addedAt: p.addedAt };
    if (this.mode === "db") return this.pageRef(bid, p.id).set(clean);
    const o = this.lsGet(); o.pages = o.pages || {}; (o.pages[bid] = o.pages[bid] || {})[p.id] = clean; this.lsSet(o);
  },
  async deletePage(bid, pid) {
    if (this.mode === "db") return this.pageRef(bid, pid).delete();
    const o = this.lsGet(); delete ((o.pages || {})[bid] || {})[pid]; this.lsSet(o);
  },
  sumCol(bid) { return this.db.doc(this.base() + "/" + bid).collection("fiches"); },
  async listSums(bid) {
    if (this.mode === "db") { const s = await this.sumCol(bid).get(); const r = {}; s.docs.forEach(d => r[d.id] = d.data()); return r; }
    return (this.lsGet().sums || {})[bid] || {};
  },
  async saveSum(bid, key, rec) {
    if (this.mode === "db") return this.sumCol(bid).doc(key).set(rec);
    const o = this.lsGet(); o.sums = o.sums || {}; (o.sums[bid] = o.sums[bid] || {})[key] = rec; this.lsSet(o);
  },
};
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);

/* ---------- OCR (Tesseract, dans le navigateur) ---------- */
const OCR = {
  worker: null, langs: "", loading: null, onProgress: null,
  base() { return new URL("tess/", document.baseURI).href; },
  async get(langs) {
    if (!window.Tesseract) throw { msg: "Le moteur de lecture n'a pas pu se charger. Vérifiez la connexion internet puis rechargez la page." };
    const key = langs.join("+");
    if (this.worker && this.langs === key) return this.worker;
    if (this.loading && this.loadingKey === key) return this.loading;
    if (this.worker) { try { await this.worker.terminate(); } catch {} this.worker = null; }
    const base = this.base();
    this.loadingKey = key;
    this.loading = (async () => {
      const w = await Tesseract.createWorker(langs, 1, {
        workerPath: base + "worker-relais.js", corePath: base, langPath: base.replace(/\/$/, ""),
        workerBlobURL: false, gzip: true, cacheMethod: "none",
        logger: m => this.onProgress?.(m),
        errorHandler: e => console.warn("OCR", e),
      });
      this.worker = w; this.langs = key; this.loading = null; return w;
    })().catch(e => { this.loading = null; throw { msg: "Le moteur de lecture n'a pas démarré (" + (e?.message || e) + ")." }; });
    return this.loading;
  },
};
async function loadImage(file) {
  let bmp = null;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch {}
  if (!bmp) {
    bmp = await new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file); img.onload = () => res(img); img.onerror = () => rej({ msg: "Ce format de photo n'est pas lisible par le navigateur (souvent HEIC). Réglez l'appareil photo sur « Le plus compatible » (JPEG) ou faites une capture d'écran de la photo." }); img.src = u; });
  }
  const w = bmp.width, h = bmp.height, scale = Math.min(1, 2400 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  const ctx = c.getContext("2d"); ctx.filter = "grayscale(1) contrast(1.15)"; ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}

const sortPages = ps => [...ps].sort((a, b) => (pnum(a.page) - pnum(b.page)) || (a.addedAt - b.addedAt));

function range(ps) {
  const n = ps.map(p => pnum(p.page)).filter(Number.isFinite);
  if (!n.length) return ps.length ? ps.length + " p." : "";
  const lo = Math.min(...n), hi = Math.max(...n);
  return lo === hi ? "p. " + lo : "p. " + lo + "–" + hi;
}
const anaCache = new Map();
function analyseCached(key, ps, opts) {
  const sig = key + "|" + JSON.stringify(opts) + "|" + ps.map(p => p.id + ":" + (p.text || "").length + ":" + p.page).join(",");
  if (!anaCache.has(sig)) { if (anaCache.size > 60) anaCache.clear(); anaCache.set(sig, Analyse.analyse(ps, opts)); }
  return anaCache.get(sig);
}

/* ---------- mises à jour : compare la version de la page à version.json sur le site ---------- */
const APP_VERSION = "20261122-0112"; // remplacé par build.js (date et heure de la publication)
const Updates = {
  remote: null, dismissed: false,
  enabled() { return !window.claude && !APP_VERSION.startsWith("__"); },
  label(v) { const m = String(v || "").match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]} à ${m[4]}h${m[5]}` : String(v || "développement"); },
  async check(manual) {
    if (!this.enabled()) { if (manual) toast("La vérification des mises à jour marche dans l'application installée depuis le site."); return; }
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      const j = await r.json(); this.remote = j.version;
      if (j.version && j.version !== APP_VERSION) {
        $("#update-txt").textContent = `Nouvelle version disponible (du ${this.label(j.version)}).`;
        if (manual) this.dismissed = false;
        if (!this.dismissed) $("#update").hidden = false;
      } else if (manual) toast(`Vous avez la dernière version (du ${this.label(APP_VERSION)}).`);
    } catch { if (manual) toast("Impossible de vérifier : pas de connexion internet."); }
  },
  apply() {
    if (S.running || S.aiRun || S.chain) { toast("Attendez la fin de la lecture ou de la fiche en cours."); return; }
    location.replace(location.pathname + "?v=" + encodeURIComponent(this.remote || Date.now()));
  },
  start() {
    $("#update-btn").onclick = () => this.apply();
    $("#update-later").onclick = () => { this.dismissed = true; $("#update").hidden = true; };
    if (!this.enabled()) return;
    this.check(false);
    setInterval(() => this.check(false), 15 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") this.check(false); });
  },
};
const versionBar = () => `<div class="version"><span>Version du ${esc(Updates.label(APP_VERSION))}</span><button class="ghost small" data-a="checkupd">Vérifier les mises à jour</button></div>`;

async function runChain(key) {

async function runAI(key, opt = {}) {
  const b = book(); if (!b) return false;
  if (S.aiRun) { toast("Une fiche est déjà en cours de rédaction."); return false; }
  if (S.chain && !opt.chain) { toast("Les fiches sont en cours de rédaction."); return false; }
  const ps = keyPages(b, key).filter(p => (p.text || "").trim()); if (!ps.length) { toast("Pas de texte à résumer."); return false; }
  S.aiRun = { bid: b.id, key, text: "", status: "Préparation de l'IA…", pct: 0 }; S.aiStop = false;
  if (key.startsWith("page:")) S.pageSum[key.slice(5)] = true;
  render();
  let ok = false;
  try {
    await IA.get(p => { S.aiRun.status = IA.engine ? "Chargement…" : `Chargement de l'IA sur votre appareil : ${Math.round((p.progress || 0) * 100)} %` + ((p.progress || 0) < 1 && !/cache/i.test(p.text || "") ? " (téléchargement la première fois, ≈" + (MODELS[S.model] || MODELS.leger).size + ")" : ""); S.aiRun.pct = p.progress || 0; paintAI(); });

    const lenKey = key.startsWith("page:") && opt.chain ? pageLen() : S.len;
    let parts = sub ? pack(sub.items, 9000) : chunkPages(ps, 7000), fromNotes = !!sub, round = 0;
    while (parts.length > 1 && round < 3) {
      const notes = [];
      for (let i = 0; i < parts.length; i++) {
        if (S.aiStop) throw { code: "stop" };
        S.aiRun.status = `Lecture ${round ? "des notes" : "du texte"} : extrait ${i + 1} sur ${parts.length}…`; S.aiRun.pct = i / parts.length; S.aiRun.text = ""; paintAI();
        notes.push(await IA.chat(notesMsgs(b, parts[i]), { max_tokens: 480, onText: t => { S.aiRun.text = "Prise de notes…\n\n" + t; paintAI(); } }));
      }
      parts = chunkPages([{ page: "notes", text: notes.join("\n") }], 9000).map(x => x.replace(/^\[p\. notes\]\n/, ""));
      fromNotes = true; round++;
    }
    if (S.aiStop) throw { code: "stop" };
    S.aiRun.status = "Rédaction de la fiche…"; S.aiRun.pct = 1; S.aiRun.text = ""; paintAI();
    const text = await IA.chat(ficheMsgs(b, scopeName(b, key), parts[0], fromNotes, lenKey, sub && round === 0 ? sub.what : ""), { max_tokens: (LENP[lenKey] || LENP.moyen)[1], onText: t => { S.aiRun.text = t; paintAI(); } });
    if (S.aiStop) throw { code: "stop" };
    const rec = { text, len: lenKey, sig: aiSig(ps), at: Date.now(), model: S.model, lang: S.outLang };
    (S.ai[b.id] = S.ai[b.id] || {})[fk(key)] = rec;
    if (!b.example) await Store.saveSum(b.id, fk(key), rec).catch(() => toast("Fiche affichée, mais pas enregistrée."));
    ok = true;
  } catch (e) {
    toast(aiErr(e));
    if (e?.code !== "stop" && /dispos|device|lost|memory|GPU/i.test(String(e?.message || e))) { try { IA.engine?.unload(); } catch {} IA.engine = null; }
  }
  S.aiRun = null; render();
  return ok;
}
let aiPaintQueued = false;

/* Rendu de la fiche : titres, parties numérotées en couleur, mots-clés surlignés, encadré « À retenir » */
function md(src) {
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<mark class="k">$1</mark>')
    .replace(/__(.+?)__/g, '<mark class="k">$1</mark>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\(\s*(?:p\.|pp\.|page|pages)\s*([0-9]{1,4}|[IVXLC]{1,6})(?:\s*[-–,]\s*[0-9]{1,4})*\s*\)/gi, (m, p) => ` <button class="chip" data-a="goto" data-id="${p}">p. ${p}</button>`);
  let html = "", list = false, sec = false, part = 0;
  const closeList = () => { if (list) { html += "</ul>"; list = false; } };
  const closeSec = () => { closeList(); if (sec) { html += "</section>"; sec = false; } };
  for (const raw of String(src || "").replace(/\r/g, "").split("\n")) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^\s*#{1,2}\s+(.*)$/))) {
      closeSec();
      const name = m[1].replace(/\*\*/g, "").replace(/[:：]\s*$/, "");
      const cls = /bref|contexte|résumé|in short|overview|resumen|breve|kurz/i.test(name) ? "ctx"
        : /retenir|essentiel|conclusion|takeaway|remember|recordar|ricordare|merken|fazit/i.test(name) ? "keep"
        : /chiffre|date|nom|clé|figure|name|cifra|fecha|nombre|cifre|nomi|zahl|daten/i.test(name) ? "facts"
        : /partie|idée|point|part|partes|parti|teil/i.test(name) ? "parts" : "other";
      html += `<section class="f f-${cls}"><h3 class="f-h">${esc(name)}</h3>`; sec = true;
    } else if ((m = line.match(/^\s*#{3,6}\s+(.*)$/))) {
      closeList(); part++;
      html += `<h4 class="f-part" style="--pc:var(--p${(part - 1) % 4 + 1})"><span class="f-num">${part}</span><span>${inline(m[1].replace(/\*\*/g, ""))}</span></h4>`;
    } else if ((m = line.match(/^\s*(?:[-*•–]|\d+[.)])\s+(.*)$/))) {
      if (!list) { html += "<ul>"; list = true; }
      html += `<li>${inline(m[1])}</li>`;
    } else if (!line.trim()) { closeList(); }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  closeSec();
  return html;
}

// Progression des fiches d'un chapitre ou du document : combien de pages ont déjà leur fiche
function chainInfo(b, key) {

  const ps = keyPages(b, key); return { done: ps.filter(p => fresh(b, "page:" + p.id, [p])).length, total: ps.length, unit: "pages" };
}
function vAI(b, key, ps) {
  const st = (S.ai[b.id] || {})[fk(key)];
  const run = S.aiRun && S.aiRun.bid === b.id && S.aiRun.key === key;
  const busy = !!(S.aiRun || S.chain);
  const multi = !key.startsWith("page:") && (key === "doc" ? chapters(b).length > 1 : ps.length > 1);
  const ci = multi ? chainInfo(b, key) : null;
  const chainBtn = multi && !IA.inClaude ? `<button class="${st ? "" : "primary"}" data-a="aichain" data-id="${key}" ${busy ? "disabled" : ""}>${key === "doc" ? `Tout résumer : chaque page, chaque ${W(b).one}, puis le document` : `Résumer chaque page, puis ${W(b).the}`}</button>` : "";

  const chainNote = S.chain && !run && multi ? `<p class="banner">${esc(S.chain.label)} : rédaction des fiches en cours, page par page. Faites défiler pour les voir apparaître.</p>` : "";
  if (st) return `<div class="ai">${chainNote}<div class="fiche">${md(st.text)}</div><div class="row small muted">Rédigée par l'IA sur votre appareil · ${esc(LEN[st.len]?.label || "")}${st.sig !== aiSig(ps) ? ` · <b class="warn-t">des pages ont changé depuis</b>` : ""}<button class="small" data-a="airun" data-id="${key}" ${busy ? "disabled" : ""}>Refaire</button>${chainBtn}${ciLine}</div></div>`;
  if (IA.inClaude) return `<div class="ai ai-empty"><p>Les fiches de synthèse par IA (contexte, grandes parties, mots-clés en couleur, « À retenir ») marchent sur le site de l'application : <a href="${GH_URL}" target="_blank" rel="noopener">${GH_URL.replace("https://", "")}</a>. L'IA y tourne sur votre appareil ; ce lien Claude ne peut pas la télécharger.</p></div>`;
  return `<div class="ai ai-empty">${chainNote}<div class="row">${chainBtn}<button class="${multi ? "" : "primary"}" data-a="airun" data-id="${key}" ${busy ? "disabled" : ""}>${multi ? "Fiche directe (plus rapide)" : "Rédiger la fiche de synthèse"}</button>${ciLine}</div>
    <p class="muted small">${multi ? "« Résumer chaque page » donne une fiche par page, puis une fiche d'ensemble construite à partir d'elles : plus long, mais plus fidèle et plus cohérent. " : ""}${IA.engine ? "L'IA est prête." : `La première fois, l'IA (≈${(MODELS[S.model] || MODELS.leger).size}) se télécharge sur votre appareil, puis reste disponible, même hors ligne. Rien n'est envoyé sur internet.`}</p></div>`;
}
/* ---------- traduction par l'IA (vers français, anglais, espagnol, italien, allemand) ---------- */
const trKey = (pid, lang = S.outLang) => "tr:" + pid + "@" + lang;
function splitText(text, max) {
  const pieces = [];
  for (const para of String(text || "").split(/\n\s*\n/)) {
    if (para.length <= max) { if (para.trim()) pieces.push(para); continue; }
    let cur = "";
    for (const s of para.match(/[^.!?;…]+[.!?;…]*\s*/g) || [para]) {
      if (cur && cur.length + s.length > max) { pieces.push(cur); cur = ""; }
      if (s.length > max) { for (let i = 0; i < s.length; i += max) pieces.push(s.slice(i, i + max)); } else cur += s;
    }
    if (cur.trim()) pieces.push(cur);
  }
  const out = []; let cur = "";
  for (const p of pieces) { if (cur && cur.length + p.length > max) { out.push(cur); cur = ""; } cur += (cur ? "\n\n" : "") + p; }
  if (cur) out.push(cur);
  return out;
}
const trMsgs = chunk => [
  { role: "system", content: "Tu es un traducteur professionnel. Tu traduis fidèlement et intégralement, sans résumer, sans commenter et sans rien ajouter." },
  { role: "user", content: `Traduis en ${(OUT[S.outLang] || OUT.fra).name} le texte ci-dessous. Il vient d'une lecture automatique de photo : corrige les mots mal lus d'après le contexte, ignore les éléments d'interface (boutons, compteurs, menus), garde les paragraphes et les noms propres. S'il est en latin ou en grec, traduis le sens avec soin. Réponds uniquement par la traduction.

TEXTE :
${chunk}` }];
async function runTranslate(pid, opt = {}) {
  const b = book(); if (!b) return false;
  if (S.aiRun) { toast("L'IA est déjà occupée."); return false; }
  if (S.chain && !opt.chain) { toast("L'IA est déjà occupée."); return false; }
  const p = pagesOf(b.id).find(x => x.id === pid); if (!p || !(p.text || "").trim()) return false;
  const O = OUT[S.outLang] || OUT.fra;
  S.aiRun = { bid: b.id, key: "tr:" + pid, text: "", status: "Préparation de l'IA…", pct: 0, plain: true }; S.aiStop = false; S.showTr[pid] = true; render();
  let ok = false;
  try {
    await IA.get(pr => { S.aiRun.status = `Chargement de l'IA sur votre appareil : ${Math.round((pr.progress || 0) * 100)} %`; S.aiRun.pct = pr.progress || 0; paintAI(); });
    const parts = splitText(p.text, 2200);
    let out = "";

      if (S.aiStop) throw { code: "stop" };
      S.aiRun.status = `Traduction en ${O.name}${parts.length > 1 ? ` : morceau ${i + 1} sur ${parts.length}` : ""}…`; S.aiRun.pct = i / parts.length; paintAI();
      const prev = out;
      const t = await IA.chat(trMsgs(parts[i]), { max_tokens: 1500, onText: t => { S.aiRun.text = (prev ? prev + "\n\n" : "") + t; paintAI(); } });
      out = (prev ? prev + "\n\n" : "") + t;
    }
    if (S.aiStop) throw { code: "stop" };
    const rec = { text: out, sig: aiSig([p]), at: Date.now(), lang: S.outLang, model: S.model };
    (S.ai[b.id] = S.ai[b.id] || {})[trKey(pid)] = rec;
    if (!b.example) await Store.saveSum(b.id, trKey(pid), rec).catch(() => toast("Traduction affichée, mais pas enregistrée."));
    ok = true;
  } catch (e) {
    toast(aiErr(e));
    if (e?.code !== "stop" && /dispos|device|lost|memory|GPU/i.test(String(e?.message || e))) { try { IA.engine?.unload(); } catch {} IA.engine = null; }
  }
  S.aiRun = null; render();
  return ok;
}
async function runTranslateAll(key) {
  const b = book(); if (!b || S.aiRun || S.chain) return;
  const ps = keyPages(b, key).filter(p => { const r = (S.ai[b.id] || {})[trKey(p.id)]; return (p.text || "").trim() && !(r && r.sig === aiSig([p])); });
  if (!ps.length) { toast("Toutes les pages sont déjà traduites dans cette langue."); return; }

/* ---------- photos ---------- */
function bindDrop() {
  const d = $("#drop"); if (!d) return;
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); stage(e.dataTransfer.files); };
  for (const f of [$("#files"), $("#cam")]) if (f) f.onchange = () => { stage(f.files); f.value = ""; };
}
function stage(files) {
  const imgs = [...files].filter(f => !f.type || f.type.startsWith("image/") || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if (imgs.length < files.length) toast("Certains fichiers ne sont pas des images et ont été ignorés.");
  if (imgs.length > 1) imgs.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  for (const f of imgs) S.staged.push({ id: uid("q"), file: f, name: f.name, url: URL.createObjectURL(f), status: "waiting" });
  render();
}
function paintProgress() {
  const s = $("#ocr-status"), b = $("#ocr-bar");
  if (s) s.textContent = S.ocrStatus || ""; if (b) b.style.width = Math.round((S.ocrPct || 0) * 100) + "%";
}

async function ensureChapter(b, sel, newName, heading, fallbackId) {
  const mk = async title => { const c = { id: uid("c"), title, order: b.chapters.length }; b.chapters.push(c); await saveBookSafe(b); return c.id; };
  if (sel === "new") { const name = newName || "Chapitre " + (b.chapters.length + 1); const ex = b.chapters.find(c => norm(c.title) === norm(name)); return ex ? ex.id : mk(name); }
  if (sel !== "auto") return sel;
  if (heading) {
    const nh = norm(heading);
    const ex = b.chapters.find(c => { const nc = norm(c.title); return nc === nh || nc.startsWith(nh) || nh.startsWith(nc); });
    return ex ? ex.id : mk(heading);
  }
  if (fallbackId) return fallbackId;
  const last = chapters(b).at(-1); if (last) return last.id;
  return mk(W(b).first);
}

async function runPhotos() {
  const b = book(); if (!b) return;
  const sel = $("#add-ch").value, newName = $("#add-newch").value.trim();
  const start = parseInt($("#add-start").value, 10);
  if (sel === "new" && !newName) { toast("Donnez un nom à la nouvelle section."); return; }
  S.running = true; S.stopReq = false; S.ocrStatus = "Chargement du moteur de lecture (la première fois, quelques secondes)…"; S.ocrPct = 0; render();
  let worker;
  OCR.onProgress = m => {
    if (m.status === "recognizing text") { S.ocrPct = m.progress; S.ocrStatus = `Lecture de la page… ${Math.round(m.progress * 100)} %`; }
    else if (/load|initializ/.test(m.status)) { S.ocrStatus = "Chargement du moteur de lecture…"; S.ocrPct = m.progress || 0; }
    paintProgress();
  };
  try { worker = await OCR.get(bookLangs(b)); }
  catch (e) { S.running = false; const msg = e?.msg || "Le moteur de lecture n'a pas démarré."; S.staged.forEach(q => { if (q.status === "waiting") { q.status = "error"; q.err = msg; } }); toast(msg); render(); return; }
  let current = sel === "auto" ? null : await ensureChapter(b, sel, newName);
  let idx = 0, ok = 0;
  const todo = S.staged.filter(q => q.status === "waiting");
  for (const q of todo) {
    if (S.stopReq) break;
    q.status = "working"; q.err = ""; S.ocrPct = 0; S.ocrStatus = `Photo ${idx + 1} sur ${todo.length} : préparation…`; render();
    try {
      const canvas = await loadImage(q.file);
      S.ocrStatus = `Photo ${idx + 1} sur ${todo.length} : lecture…`; paintProgress();
      let { data } = await worker.recognize(canvas, { rotateAuto: true });
      // Si la page est dans une autre langue que celle réglée, on ajoute cette langue et on relit la photo.
      const det = Analyse.detectLang(String(data?.text || ""));
      if (det && !bookLangs(b).includes(det) && LANGS.some(l => l[0] === det) && (data?.text || "").length > 80) {
        b.langs = [...bookLangs(b), det]; saveBookSafe(b);
        S.ocrStatus = `Photo ${idx + 1} : texte en ${langName(det).toLowerCase()} détecté, nouvelle lecture…`; paintProgress();
        toast(`Texte en ${langName(det).toLowerCase()} détecté : langue ajoutée au document.`);
        worker = await OCR.get(bookLangs(b));
        const again = (await worker.recognize(canvas, { rotateAuto: true })).data;
        if ((again?.confidence ?? 0) >= (data?.confidence ?? 0)) data = again;
      }
      const raw = String(data?.text || "").trim();
      const letters = (raw.match(/\p{L}/gu) || []).length;
      if (letters < 20) throw { msg: `Presque aucun texte reconnu${data?.confidence != null ? " (confiance " + Math.round(data.confidence) + " %)" : ""}. Reprenez la photo plus près, bien à plat et éclairée, ou vérifiez la langue du livre.` };
      const pp = Analyse.parsePage(raw);
      if (sel === "auto") current = await ensureChapter(b, "auto", "", pp.heading, current);
      const page = pp.page || (Number.isFinite(start) ? String(start + idx) : null);
      const p = { id: uid("p"), chapterId: current, page, text: raw, source: "photo", addedAt: Date.now() };
      await Store.savePage(b.id, p);
      (S.pages[b.id] = S.pages[b.id] || []).push(p);
      q.status = "done"; q.page = page; ok++;
      if (data?.confidence != null && data.confidence < 55) q.err = `Lecture incertaine (${Math.round(data.confidence)} %) : vérifiez le texte.`;
    } catch (e) {
      q.status = "error"; q.err = e?.msg || ("Lecture impossible : " + (e?.message || e?.code || String(e)));
    }
    idx++; render();
  }
  S.running = false; OCR.onProgress = null;
  if (ok) { toast(ok + " page(s) ajoutée(s)."); if (current && S.sel === "overview") S.sel = current; }
  b.pageCount = (S.pages[b.id] || []).length; saveBookSafe(b);
  render();
}

function doSearch() {
  const b = book(), q = ($("#ask")?.value || "").trim(); if (!q || !b) return;
  const chs = chapters(b);
  const ps = S.sel === "_none" ? pagesOf(b.id).filter(p => !chs.some(x => x.id === p.chapterId)) : chPages(b.id, S.sel);
  S.answer = Analyse.search(q, ps, anaLang(b)); S.answerFor = S.sel; render();
}

function gotoPage(pg) {
  const b = book(); if (!b) return;
  const all = sortPages(pagesOf(b.id));
  const p = all.find(x => String(x.page) === String(pg)) || all.find(x => pnum(x.page) === pnum(pg));
  if (!p) { toast("La page " + pg + " n'est pas dans le carnet."); return; }
  const chs = chapters(b), target = chs.some(c => c.id === p.chapterId) ? p.chapterId : "_none";
  if (S.sel !== target) { S.sel = target; render(); }
  const el = document.getElementById("pg-" + p.id); if (!el) return;
  el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600);
}

/* ---------- actions ---------- */
function readBookForm() {
  const v = id => ($("#" + id)?.value || "").trim();
  const langs = [...app.querySelectorAll('input[name="bf-lang"]:checked')].map(i => i.value);
  return { type: v("bf-type") || "livre", title: v("bf-title"), author: v("bf-author"), year: v("bf-year"), publisher: v("bf-publisher"), genre: v("bf-genre"), notes: v("bf-notes"), langs: langs.length ? langs : ["fra"] };
}
async function saveBookSafe(b) { try { await Store.saveBook(b); return true; } catch (e) { toast("Enregistrement impossible : " + (e?.code === "quota_exceeded" ? "espace plein." : "réessayez.")); return false; } }

async function openBook(id) {
  S.bookId = id; S.view = "book"; S.sel = "overview"; S.addOpen = false; S.editBook = false; S.confirmDel = null; S.answer = null; S.staged = []; S.editing = null;
  if (id !== EX_ID && !S.pages[id]) {
    render();
    try { S.pages[id] = await withTimeout(Store.listPages(id), 12000); }
    catch { S.pages[id] = []; toast("Les pages n'ont pas pu être chargées. Vérifiez la connexion puis rouvrez le document."); }
    try { S.ai[id] = await withTimeout(Store.listSums(id), 12000); } catch { S.ai[id] = S.ai[id] || {}; }
  }
  if (id !== EX_ID && !S.pages[id].length) { S.addOpen = true; S.addTab = isBook(book()) ? "photos" : "texte"; }
  render(); window.scrollTo(0, 0);
}

app.addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if (!t || t.tagName === "SELECT") return;
  const a = t.dataset.a, id = t.dataset.id, b = book();
  if (!["delpage", "delbook", "delch", "askdelbook", "askdelch"].includes(a)) S.confirmDel = null;
  switch (a) {
    case "airun": runAI(id); break;
    case "aichain": runChain(id); break;
    case "trrun": runTranslate(id); break;
    case "checkupd": Updates.check(true); break;
    case "trall": runTranslateAll(id); break;
    case "aistop": S.aiStop = true; if (S.chain) S.chain.stop = true; try { IA.engine?.interruptGenerate(); } catch {} break;
    case "newbook": S.showNewBook = true; S.view = "library"; render(); $("#bf-title")?.focus(); break;
    case "cancelbook": S.showNewBook = false; S.resetForms = true; render(); break;
    case "createbook": {
      const f = readBookForm(); if (!f.title) { toast("Le titre est obligatoire."); return; }
      const nb = { id: uid("b"), ...f, chapters: [], createdAt: Date.now(), pageCount: 0 };
      if (!(await saveBookSafe(nb))) return;
      S.books.push(nb); S.pages[nb.id] = []; S.showNewBook = false; S.resetForms = true;
      await openBook(nb.id); break;
    }
    case "open": openBook(id); break;
    case "lib": S.view = "library"; S.bookId = null; render(); break;
    case "sel": S.sel = id; S.renaming = null; S.editing = null; render(); window.scrollTo({ top: 0 }); break;
    case "toggleadd": S.addOpen = !S.addOpen; render(); break;
    case "tab": S.addTab = id; render(); break;
    case "unstage": S.staged = S.staged.filter(q => q.id !== id); render(); break;
    case "clearq": S.staged.forEach(q => URL.revokeObjectURL(q.url)); S.staged = []; render(); break;
    case "retry": S.staged.forEach(q => { if (q.status === "error") { q.status = "waiting"; q.err = ""; } }); render(); break;
    case "runphotos": runPhotos(); break;
    case "stop": S.stopReq = true; S.ocrStatus = "Arrêt après la page en cours…"; paintProgress(); break;
    case "runtext": runText(); break;
    case "addch": {
      const name = ($("#newch")?.value || "").trim(); if (!name) { $("#newch")?.focus(); return; }
      const c = { id: uid("c"), title: name, order: b.chapters.length }; b.chapters.push(c);
      if (await saveBookSafe(b)) { $("#newch").value = ""; S.sel = c.id; render(); } break;
    }
    case "renamech": S.renaming = S.sel; render(); $("#rename")?.focus(); break;
    case "saverename": {
      const c = b.chapters.find(x => x.id === S.sel), v = ($("#rename")?.value || "").trim();
      if (c && v) { c.title = v; await saveBookSafe(b); } S.renaming = null; render(); break;
    }
    case "askdelch": S.confirmDel = S.sel; render(); break;
    case "delch": {
      b.chapters = b.chapters.filter(c => c.id !== S.sel); chapters(b).forEach((c, i) => c.order = i);
      await saveBookSafe(b); S.sel = "overview"; toast(W(b).one[0].toUpperCase() + W(b).one.slice(1) + " supprimé" + (isBook(b) ? "" : "e") + ". Ses pages sont gardées dans « " + W(b).none + " »."); render(); break;
    }
    case "delpage": {
      if (S.confirmDel !== id) { S.confirmDel = id; render(); return; }
      try { await Store.deletePage(b.id, id); S.pages[b.id] = S.pages[b.id].filter(p => p.id !== id); b.pageCount = S.pages[b.id].length; saveBookSafe(b); toast("Page supprimée."); } catch { toast("Suppression impossible, réessayez."); }
      S.confirmDel = null; render(); break;
    }
    case "edit": S.editing = id; render(); break;
    case "len": S.len = id; try { localStorage.setItem("carnet-len", id); } catch {} render(); break;
    case "pagesum": S.pageSum[id] = true; render(); break;
    case "pageclose": S.pageSum[id] = false; render(); break;
    case "canceledit2": S.editing = null; render(); break;
    case "saveedit": {
      const p = pagesOf(b.id).find(x => x.id === id); if (!p) return;
      p.text = $("#ed-text-" + id).value; p.page = $("#ed-page-" + id).value.trim() || null;
      try { await Store.savePage(b.id, p); toast("Page corrigée."); } catch { toast("Enregistrement impossible, réessayez."); }
      S.editing = null; render(); break;
    }
    case "editbook": S.editBook = true; render(); break;
    case "canceledit": S.editBook = false; S.resetForms = true; render(); break;
    case "savebook": { const f = readBookForm(); if (!f.title) { toast("Le titre est obligatoire."); return; } Object.assign(b, f); if (await saveBookSafe(b)) { S.editBook = false; S.resetForms = true; toast("Informations enregistrées."); } render(); break; }
    case "askdelbook": S.confirmDel = "book"; render(); break;
    case "nodel": S.confirmDel = null; render(); break;
    case "delbook": {
      try { await Store.deleteBook(b, pagesOf(b.id)); S.books = S.books.filter(x => x.id !== b.id); S.view = "library"; S.bookId = null; toast("Document supprimé."); } catch { toast("Suppression impossible, réessayez."); }
      S.confirmDel = null; render(); break;
    }
    case "ask": doSearch(); break;
    case "goto": gotoPage(id); break;
    case "export": exportAll(); break;
  }
});

/* ---------- export / import (passer ses documents d'un appareil à l'autre) ---------- */
async function exportAll() {
  if (!S.books.length) { toast("Aucun document à exporter."); return; }
  const docs = [];
  for (const b of S.books) {
    if (!S.pages[b.id]) { try { S.pages[b.id] = await Store.listPages(b.id); } catch { S.pages[b.id] = []; } }
    docs.push({ ...b, pages: S.pages[b.id] });
  }
  const data = JSON.stringify({ app: "carnet-de-lecture", version: 1, exportedAt: new Date().toISOString(), documents: docs });
  const filename = "carnet-de-lecture-" + new Date().toISOString().slice(0, 10) + ".json";
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) { try { const r = await dl.save({ filename, data }); if (r?.status === "saved") toast("Fichier enregistré."); } catch (e) { if (e?.code === "unavailable") toast("Export impossible dans cette vue."); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("Fichier téléchargé : " + filename);
}
async function importFile(file) {
  let j; try { j = JSON.parse(await file.text()); } catch { toast("Ce fichier n'est pas un export du Carnet de lecture."); return; }
  const docs = arr(j?.documents); if (j?.app !== "carnet-de-lecture" || !docs.length) { toast("Ce fichier n'est pas un export du Carnet de lecture."); return; }
  let n = 0;
  for (const d of docs) {
    if (!d?.id || !d.title) continue;
    const { pages, ...b } = d; b.chapters = arr(b.chapters); b.pageCount = arr(pages).length;
    try {
      await Store.saveBook(b);
      for (const p of arr(pages)) if (p?.id) await Store.savePage(b.id, p);
    } catch { toast("Import interrompu : espace plein ou connexion coupée."); break; }
    const ex = S.books.find(x => x.id === b.id); if (ex) Object.assign(ex, b); else S.books.push(b);
    const ids = new Set(arr(pages).map(p => p.id));
    S.pages[b.id] = [...(S.pages[b.id] || []).filter(p => !ids.has(p.id)), ...arr(pages)];
    n++;
  }
  if (n) toast(n + " document(s) importé(s).");
  render();
}

app.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "imp" && t.files?.[0]) { const f = t.files[0]; t.value = ""; importFile(f); return; }
  if (t.id === "model-sel") { S.model = t.value; try { localStorage.setItem("carnet-model", t.value); } catch {} toast("IA choisie : " + MODELS[t.value].label.split(" :")[0] + ". Elle se chargera à la prochaine fiche."); return; }
  if (t.dataset?.a === "outlang") { S.outLang = t.value; try { localStorage.setItem("carnet-outlang", t.value); } catch {} render(); return; }
  if (t.dataset?.a !== "move" || !t.value) return;
  const b = book(), p = pagesOf(b.id).find(x => x.id === t.dataset.id); if (!p) return;
  p.chapterId = t.value;
  try { await Store.savePage(b.id, p); toast("Page déplacée."); } catch { toast("Déplacement impossible."); }
  render();
});
app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "ask") { e.preventDefault(); doSearch(); }
  if (e.target.id === "newch") { e.preventDefault(); $('[data-a="addch"]')?.click(); }
  if (e.target.id === "rename") { e.preventDefault(); $('[data-a="saverename"]')?.click(); }
});

/* ---------- boot ---------- */
(async function boot() {
  const use = n => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user] = await Promise.all([use("db"), use("user")]);
  await Store.init(db, user);
  try { S.books = await withTimeout(Store.listBooks(), 12000); }
  catch { S.loadErr = "La bibliothèque n'a pas pu être chargée pour l'instant. Vérifiez la connexion puis rechargez la page."; S.books = []; }
  S.books.forEach(b => { b.chapters = arr(b.chapters); });
  S.ready = true; render();
  Updates.start();
})();
</script>
